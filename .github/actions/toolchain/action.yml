# Builds the pinned toolchain image of one architecture and, when asked to,
# runs a command inside it on the repository checkout. The image name, tag and
# Containerfile default to the ones the Makefile uses (IMAGE, IMAGE_TAG and
# tools/Containerfile), so a caller only says which architecture it needs.
#
# The container runs as the runner's own user and without network, as in the
# local flow: the repository is bind-mounted, so files stay owned by the runner
# and git does not reject the mounted submodule as "dubious ownership".
name: Toolchain container
description: Builds or loads the pinned toolchain image and runs a command in it.

inputs:
  arch:
    description: Architecture of the image and of its container (x86_64, arm64).
    required: true
  platform:
    description: OCI platform of the image, e.g. linux/amd64.
    required: true
  qemu:
    description: Set up qemu before building, when the image is foreign to the runner.
    required: false
    default: "false"
  mode:
    description: cache fills the docker layer cache and stops; run loads the image.
    required: false
    default: run
  command:
    description: Command to run inside the container in run mode.
    required: false
    default: ""
  image:
    description: Image repository name, kept in step with the Makefile's IMAGE.
    required: false
    default: godot-libretro-toolchain
  image_tag:
    description: Image tag prefix, kept in step with the Makefile's IMAGE_TAG.
    required: false
    default: "12"
  containerfile:
    description: Containerfile of the image, relative to the workspace.
    required: false
    default: tools/Containerfile
  context:
    description: Build context of the image, relative to the workspace.
    required: false
    default: tools

runs:
  using: composite
  steps:
    - name: Set up qemu
      if: inputs.qemu == 'true'
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - name: Set up buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    # One build step per mode: buildx cannot load an image and write a
    # cache-only output in the same build.
    - name: Build the toolchain image into the layer cache
      if: inputs.mode == 'cache'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.containerfile }}
        platforms: ${{ inputs.platform }}
        tags: ${{ inputs.image }}:${{ inputs.image_tag }}-${{ inputs.arch }}
        outputs: type=cacheonly
        cache-from: type=gha,scope=toolchain-${{ inputs.arch }}
        cache-to: type=gha,mode=max,scope=toolchain-${{ inputs.arch }}
    - name: Load the toolchain image
      if: inputs.mode == 'run'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.containerfile }}
        platforms: ${{ inputs.platform }}
        tags: ${{ inputs.image }}:${{ inputs.image_tag }}-${{ inputs.arch }}
        load: true
        cache-from: type=gha,scope=toolchain-${{ inputs.arch }}
    - name: Run in the toolchain container
      if: inputs.mode == 'run' && inputs.command != ''
      shell: bash
      env:
        # Passed through the environment so the command keeps its own quoting.
        TOOLCHAIN_COMMAND: ${{ inputs.command }}
      run: |
        docker run --rm --platform "${{ inputs.platform }}" --network none \
          --user "$(id -u):$(id -g)" -e HOME=/tmp \
          -v "$GITHUB_WORKSPACE:/work" -w /work \
          "${{ inputs.image }}:${{ inputs.image_tag }}-${{ inputs.arch }}" \
          bash -c "$TOOLCHAIN_COMMAND"
