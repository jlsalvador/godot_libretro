# Builds the linux matrix inside the pinned Debian 12 (GCC 12) toolchain image
# of each architecture, natively, like the local flow. Every build command
# lives in the Makefile: CI starts the container itself and runs
# `make IN_CONTAINER=1 <target>` inside it, so nothing here repeats compiler
# flags.
#
# arm64 containers run under qemu on the amd64 runner (measured locally: a
# CPU-bound gzip of 200 MB took 0.71 s native and 2.26 s emulated). To use
# native arm64 runners instead (free for public repositories), set the
# repository variable ARM_RUNNER to `ubuntu-24.04-arm`: qemu is then skipped.
#
# Flow: toolchain (build each image once, fill the layer cache) -> extension
# (per architecture, in parallel) -> test-godot (headless Godot harness on
# the x86_64 extension, against the dummy test core) -> package -> publish
# (tags only).
# Extension artifacts restore a per-job ccache (actions/cache/restore) and
# save it under a per-run key (actions/cache/save); the jobs build disjoint
# trees, so one key per job per architecture, and tag builds after the first
# only compile the sources that changed.
name: build

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

# Runs are keyed on the full ref, so each tag build is its own group and a
# fresh tag push never cancels an in-flight tag run (a tag run publishes).
concurrency:
  group: build-${{ github.ref }}

permissions:
  contents: read

env:
  IMAGE: godot-libretro-toolchain
  IMAGE_TAG: "12"
  # Where the toolchain image is defined; the build context is tools/ (as in
  # `make toolchain-image`). Docker, unlike podman, does not look for a
  # Containerfile by itself.
  CONTAINERFILE: tools/Containerfile
  # Godot used by the headless harness; api_version in the Makefile is 4.7.
  GODOT_VERSION: 4.7.2-stable
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65

# Every job that runs the toolchain container does the same three things: set
# up qemu (arm64 on an amd64 runner only), set up buildx, and load the image
# from the layer cache that the `toolchain` job filled (a cache miss rebuilds
# it). The container runs as the runner's own user: the repository is
# bind-mounted, so files stay owned by the runner and git does not reject the
# mounted submodule as "dubious ownership". The network is off, as in the
# local flow.
jobs:
  toolchain:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && vars.ARM_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools
      - uses: docker/setup-qemu-action@v4.4.0
        if: matrix.arch == 'arm64' && !vars.ARM_RUNNER
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build the toolchain image and fill the cache
        uses: docker/build-push-action@v7.4.0
        with:
          context: tools
          file: ${{ env.CONTAINERFILE }}
          platforms: ${{ matrix.arch == 'arm64' && 'linux/arm64' || 'linux/amd64' }}
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=toolchain-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=toolchain-${{ matrix.arch }}

  extension:
    needs: toolchain
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && vars.ARM_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.arch == 'arm64' && 'linux/arm64' || 'linux/amd64' }}
      ELF_ARCH: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86-64' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize submodules (single level)
        run: make submodules
      - uses: docker/setup-qemu-action@v4.4.0
        if: matrix.arch == 'arm64' && !vars.ARM_RUNNER
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Load the toolchain image
        uses: docker/build-push-action@v7.4.0
        with:
          context: tools
          file: ${{ env.CONTAINERFILE }}
          platforms: ${{ matrix.arch == 'arm64' && 'linux/arm64' || 'linux/amd64' }}
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
          load: true
          cache-from: type=gha,scope=toolchain-${{ matrix.arch }}
      - name: Restore the ccache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.arch }}-v1-extension
          restore-keys: ccache-${{ matrix.arch }}-v1-extension
      - name: Build the extension (debug and release)
        run: |
          docker run --rm --platform "$PLATFORM" --network none \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/work -w /work \
            "$IMAGE:$IMAGE_TAG-$ARCH" \
            make IN_CONTAINER=1 extension-variants ARCH="$ARCH"
      - name: Save the ccache
        uses: actions/cache/save@v6.1.0
        with:
          path: .ccache
          key: ccache-${{ matrix.arch }}-v1-extension-r${{ github.run_id }}
      - name: Check the artifact architecture
        run: |
          mapfile -d '' sos < <(find build/godot_libretro -name '*.so' -print0)
          [ "${#sos[@]}" -gt 0 ] || { echo "No .so artifacts in build/godot_libretro" >&2; exit 1; }
          for so in "${sos[@]}"; do
            file -b "$so" | grep -q "$ELF_ARCH" || { echo "$so is not $ELF_ARCH" >&2; exit 1; }
          done
      # A tarball, not the directory: it keeps the modification times that make
      # compares in the package job (a plain artifact download resets them) and
      # the build/ prefix of the paths.
      - name: Pack the artifact
        run: tar -cf "extension-$ARCH.tar" build/godot_libretro
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: extension-${{ matrix.arch }}
          path: extension-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 7

  # The package job skips the Makefile's verification gate (SKIP_VERIFY=1)
  # because this job runs the Godot harness: it loads the x86_64 extension
  # against the dummy test core through the real dlmopen path, natively.
  test-godot:
    needs: extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLATFORM: linux/amd64
      ARCH: x86_64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize submodules (single level)
        run: make submodules
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Load the host toolchain image
        uses: docker/build-push-action@v7.4.0
        with:
          context: tools
          file: ${{ env.CONTAINERFILE }}
          platforms: ${{ env.PLATFORM }}
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}-${{ env.ARCH }}
          load: true
          cache-from: type=gha,scope=toolchain-x86_64
      - uses: actions/download-artifact@v8.0.2
        with:
          name: extension-x86_64
          path: artifacts
      - name: Unpack the artifacts
        run: for t in artifacts/*.tar; do tar -xf "$t"; done
      - name: Install Godot
        run: |
          zip="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${zip}"
          echo "${GODOT_SHA512}  $RUNNER_TEMP/godot.zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/${zip%.zip}"
          echo "GODOT=$RUNNER_TEMP/godot/${zip%.zip}" >> "$GITHUB_ENV"
      # The dummy core compiles against the pinned libretro.h, so it builds
      # in the toolchain container; the harness itself runs natively, as in
      # the local flow. PREBUILT=1: the extension comes from the artifact.
      - name: Build the dummy test core
        run: |
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/work -w /work \
            "$IMAGE:$IMAGE_TAG-$ARCH" \
            make IN_CONTAINER=1 dummy
      # The harness proves the frontend Vulkan device path; the runner has
      # no GPU, so the lavapipe software ICD stands in for the device.
      - name: Install the software Vulkan driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan1 libgl1-mesa-dri
          echo "=== mesa/vulkan packages ==="
          dpkg -l 2>/dev/null | grep -Ei 'libgl1|libvulkan|mesa' || true
          echo "=== ICD manifests after install ==="
          ls -la /usr/share/vulkan/icd.d /etc/vulkan/icd.d 2>&1 || true
          dpkg -S lvp_icd 2>/dev/null || true
      - name: Show the Vulkan environment
        run: |
          echo "=== ICD manifests ==="
          for d in /etc/vulkan/icd.d /usr/share/vulkan/icd.d; do
            echo "--- $d"
            ls -la "$d" 2>&1 || true
          done
          echo "=== vulkaninfo devices ==="
          sudo apt-get install -y -qq vulkan-tools >/dev/null
          vulkaninfo 2>&1 | grep -aE 'apiVersion|deviceName|driverName|========' | head -40 || true
      - name: Run the Godot harness against the dummy core
        run: make IN_CONTAINER=1 PREBUILT=1 test-godot

  package:
    needs: [extension, test-godot]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLATFORM: linux/amd64
      ARCH: x86_64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Load the host toolchain image
        uses: docker/build-push-action@v7.4.0
        with:
          context: tools
          file: ${{ env.CONTAINERFILE }}
          platforms: ${{ env.PLATFORM }}
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}-${{ env.ARCH }}
          load: true
          cache-from: type=gha,scope=toolchain-x86_64
      - uses: actions/download-artifact@v8.0.2
        with:
          merge-multiple: true
          path: artifacts
      - name: Unpack the artifacts
        run: for t in artifacts/*.tar; do tar -xf "$t"; done
      # SKIP_VERIFY=1 also means PREBUILT: the unpacked binaries are used as
      # they are.
      - name: Package the extension zip
        run: |
          docker run --rm --platform "$PLATFORM" --network none \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/work -w /work \
            "$IMAGE:$IMAGE_TAG-$ARCH" \
            make IN_CONTAINER=1 package SKIP_VERIFY=1 VERSION="${GITHUB_REF_NAME//\//-}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: package
          path: dist
      - name: Upload release assets
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --notes "Precompiled Linux matrix."
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
