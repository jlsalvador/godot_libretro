# Builds the linux matrix inside the pinned Debian 12 (GCC 12) toolchain
# image of each architecture, natively, exactly like the local flow. Every
# build command lives in the Makefile: CI starts the container itself and runs
# `make IN_CONTAINER=1 <target>` inside it, so nothing here repeats compiler
# flags (the previous version of this file did, and those flags were wrong:
# mGBA has no Makefile to `make`, FCEUmm/bsnes ignore `OBJARCH`, and Gambatte
# only switches on `CROSS_COMPILE=1`, not a toolchain prefix).
#
# arm64 containers run under qemu on the amd64 runner (measured locally: a
# CPU-bound gzip of 200 MB took 0.71 s native and 2.26 s emulated).
#
# NOTE: this repository has no remote yet, so the YAML itself has never been
# executed by a runner. The commands inside it are the ones validated locally.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE: godot-libretro-toolchain
  IMAGE_TAG: "12"

jobs:
  extension:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    runs-on: ubuntu-24.04
    env:
      OCI_PLATFORM: ${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}
      ELF_ARCH: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86-64' }}
      IMAGE_NAME: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Init submodules (single level)
        run: git submodule update --init
      - name: Build the toolchain image
        run: >-
          docker build --platform linux/$OCI_PLATFORM
          -t "$IMAGE_NAME" tools/
      - name: Build the extension
        run: |
          for target in template_debug template_release; do
            docker run --rm --platform linux/$OCI_PLATFORM \
              -v "$PWD":/work -w /work "$IMAGE_NAME" \
              make IN_CONTAINER=1 extension ARCH=${{ matrix.arch }} TARGET="$target"
          done
      - name: Check the artifact architecture
        run: |
          for so in $(find build/godot_libretro/${{ matrix.arch }} -name '*.so'); do
            file -b "$so" | grep -q "$ELF_ARCH" || { echo "$so is not $ELF_ARCH" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.arch }}
          path: build/godot_libretro/${{ matrix.arch }}/

  cores:
    strategy:
      matrix:
        core: [fceumm, bsnes, mupen64plus-next, gambatte, mgba]
        arch: [x86_64, arm64]
    runs-on: ubuntu-24.04
    env:
      OCI_PLATFORM: ${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}
      ELF_ARCH: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x86-64' }}
      IMAGE_NAME: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Init submodules (single level)
        run: git submodule update --init
      - name: Build the toolchain image
        run: >-
          docker build --platform linux/$OCI_PLATFORM
          -t "$IMAGE_NAME" tools/
      - name: Build the core
        run: >-
          docker run --rm --platform linux/$OCI_PLATFORM \
            -v "$PWD":/work -w /work "$IMAGE_NAME" \
            make IN_CONTAINER=1 core-${{ matrix.core }} ARCH=${{ matrix.arch }}
      - name: Strip and verify the stripped core
        run: >-
          docker run --rm --platform linux/$OCI_PLATFORM \
            -v "$PWD":/work -w /work "$IMAGE_NAME" \
            make IN_CONTAINER=1 roms check-stripped ARCH=${{ matrix.arch }}
            CHECK_CORES=${{ matrix.core }}
      - name: Check the artifact architecture
        run: |
          for so in $(find build/libretro/${{ matrix.arch }} build/dist/${{ matrix.arch }} -name '*.so'); do
            file -b "$so" | grep -q "$ELF_ARCH" || { echo "$so is not $ELF_ARCH" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.core }}-${{ matrix.arch }}
          path: |
            build/libretro/${{ matrix.arch }}/
            build/dist/${{ matrix.arch }}/

  roms:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the sample ROMs
        run: make roms
      - uses: actions/upload-artifact@v4
        with:
          name: roms
          path: build/roms/

  package:
    needs: [extension, cores, roms]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: .
          merge-multiple: true
      - name: Build the host toolchain image
        run: docker build --platform linux/amd64 -t ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}-x86_64 tools/
      - name: Package zips
        run: >-
          docker run --rm -v "$PWD":/work -w /work
          ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}-x86_64
          make IN_CONTAINER=1 package SKIP_VERIFY=1 VERSION="${GITHUB_REF_NAME:-local}"
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            dist/*.zip
            dist/manifest.md5

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" || gh release create "${GITHUB_REF_NAME}" --notes "Precompiled Linux matrix."
          gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/manifest.md5 --clobber
