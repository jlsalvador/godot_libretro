# Builds the linux matrix with the pinned Bootlin cross toolchains, on an
# x86_64 runner: arm64 is cross-compiled, so no container, emulator or arm64
# machine is involved. Every build command lives in the Makefile, and this
# workflow only arranges the steps around it.
#
# Flow: the extension build of each architecture (reusable workflow, in
# parallel) -> test-godot (headless Godot harness on the x86_64 extension,
# against the dummy test core) -> package -> publish (tags only; the release
# body is the tag's own message when it has one).
#
# A release (a tag push or a manual run) builds both architectures. Branch
# pushes and pull requests build x86_64 only and stop after the harness: the
# arm64 build is the one a release needs, and nothing else does.
#
# The extension jobs share a per-architecture ccache (actions/cache), so a tag
# build after the first only compiles the sources that changed.
#
# Actions are pinned by commit SHA with the version in the trailing comment:
# bump both together.
name: build

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runs are keyed on the full ref, so each tag build is its own group and a
# fresh tag push never cancels an in-flight tag run (a tag run publishes).
# Every other run cancels a superseded run of the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  # Godot used by the headless harness; api_version in the Makefile is 4.7.
  GODOT_VERSION: 4.7.2-stable
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65

jobs:
  # One call per architecture instead of one matrix job: the Godot harness
  # needs the x86_64 artifact and must not wait for the arm64 build.
  extension-x86_64:
    uses: ./.github/workflows/extension.yml
    with:
      arch: x86_64
      elf_arch: x86-64

  extension-arm64:
    # Releases only: a branch push or a pull request stops after the harness.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/extension.yml
    with:
      arch: arm64
      elf_arch: aarch64

  # The package job skips the Makefile's verification gate (SKIP_VERIFY=1)
  # because this job runs the Godot harness: it loads the x86_64 extension
  # against the dummy test core through the real dlmopen path, natively.
  test-godot:
    needs: extension-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize submodules (single level)
        run: make submodules
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-x86_64
          path: artifacts
      - name: Unpack the artifacts
        run: for t in artifacts/*.tar; do tar -xf "$t"; done
      - name: Install Godot
        run: |
          zip="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${zip}"
          echo "${GODOT_SHA512}  $RUNNER_TEMP/godot.zip" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/${zip%.zip}"
          echo "GODOT=$RUNNER_TEMP/godot/${zip%.zip}" >> "$GITHUB_ENV"
      # PREBUILT=1: the extension comes from the artifact. The dummy core and
      # the probe are built here with the host tools.
      - name: Run the raw Libretro probe and the Godot harness
        run: |
          make test-probe
          make PREBUILT=1 test-godot

  package:
    # Releases only, and the zip carries both architectures: a branch push or
    # a pull request stops after the harness, which has already validated the
    # x86_64 extension by then.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [extension-x86_64, extension-arm64, test-godot]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: artifacts
      - name: Unpack the artifacts
        run: for t in artifacts/*.tar; do tar -xf "$t"; done
      - name: Compose the artifact version
        id: version
        run: echo "version=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
      # SKIP_VERIFY=1 also means PREBUILT: the unpacked binaries are used as
      # they are.
      - name: Package the extension zip
        run: make package SKIP_VERIFY=1 VERSION=${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # Tags only: the release title and body come from the tag's own message when
  # the tag carries one (an annotated tag), its first line aside; the tag name
  # and the one-line default fill in when it does not.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist
      - name: Resolve the release title and body
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          title="$GITHUB_REF_NAME"
          message=""
          tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type')
          if [ "$tag_type" = "tag" ]; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')
            message=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.message // ""')
          fi
          # The message's first line is the release title and the rest its
          # body, so the release does not repeat its own headline.
          subject=$(printf '%s\n' "$message" | head -n 1)
          body=$(printf '%s\n' "$message" | tail -n +2 | sed '/./,$!d')
          if [ -n "$(printf '%s' "$subject" | tr -d '[:space:]')" ]; then
            title=$subject
          fi
          if [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$body" > "$notes"
          else
            printf 'Precompiled Linux matrix.\n' > "$notes"
          fi
          {
            echo "RELEASE_TITLE=$title"
            echo "RELEASE_NOTES=$notes"
          } >> "$GITHUB_ENV"
      - name: Publish the release
        run: |
          # The tag is the single source of truth for the title and the body,
          # so a re-run syncs an existing release instead of keeping a stale
          # one.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
